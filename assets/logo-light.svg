<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 128" width="470" height="128" role="img" aria-label="mri-research">
  <title>mri-research</title>
  <!-- Icon: radial k-space sampling (spokes through the center of k-space) -->
  <g transform="translate(8,14)">
    <circle cx="50" cy="50" r="47" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <g stroke="#5B9BFF" stroke-width="2.6" stroke-linecap="round">
      <line x1="10" y1="50" x2="90" y2="50"/>
      <line x1="10" y1="50" x2="90" y2="50" transform="rotate(20 50 50)"/>
      <line x1="10" y1="50" x2="90" y2="50" transform="rotate(40 50 50)"/>
      <line x1="10" y1="50" x2="90" y2="50" transform="rotate(60 50 50)"/>
      <line x1="10" y1="50" x2="90" y2="50" transform="rotate(80 50 50)"/>
      <line x1="10" y1="50" x2="90" y2="50" transform="rotate(100 50 50)"/>
      <line x1="10" y1="50" x2="90" y2="50" transform="rotate(120 50 50)"/>
      <line x1="10" y1="50" x2="90" y2="50" transform="rotate(140 50 50)"/>
      <line x1="10" y1="50" x2="90" y2="50" transform="rotate(160 50 50)"/>
    </g>
    <circle cx="50" cy="50" r="6.5" fill="#5B9BFF"/>
  </g>
  <!-- Wordmark -->
  <text x="122" y="62" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#FFFFFF">mri<tspan fill="#5B9BFF">-</tspan><tspan font-weight="600" fill="#A8B2C1">research</tspan></text>
  <text x="124" y="90" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" letter-spacing="0.3" fill="#A8B2C1">a multi-agent skill for MRI research</text>
</svg>
